<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic Marble ist umgezogen</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.magic-camelot.com/marble/play/">
<meta http-equiv="refresh" content="3; url=https://www.magic-camelot.com/marble/play/">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: radial-gradient(ellipse at 50% 35%, #0a2738 0%, #061c2b 45%, #06111b 100%); color: #f0e6d2; font: 17px/1.55 Georgia, serif; text-align: center; }
  main { max-width: 34rem; }
  h1 { font-size: clamp(26px, 6vw, 38px); margin: 0 0 12px; color: #faf6ec; letter-spacing: .02em; }
  p { margin: 0 0 12px; color: #b9ad93; }
  a.btn { display: inline-block; margin-top: 12px; padding: 12px 22px; background: #d4af37; color: #06111b; font-weight: 700; text-decoration: none; border-radius: 2px; }
  a.btn:hover { background: #e8c867; }
  .en { margin-top: 28px; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Magic Marble ist umgezogen</h1>
  <p>Das Spiel läuft jetzt auf unserem eigenen Server, ohne fremde Dienste dazwischen. Du wirst gleich weitergeleitet.</p>
  <a class="btn" id="go" href="https://www.magic-camelot.com/marble/play/">Weiter zu Magic Marble</a>
  <p class="en" lang="en">Magic Marble has moved to its own home. You will be taken there in a moment.</p>
</main>
<script>
  // Keep a level link (#uhrturm) and send everyone to the new home. An installed app from this address
  // also gets its old service worker removed, so nothing stale stays behind.
  var target = 'https://www.magic-camelot.com/marble/play/' + location.hash;
  document.getElementById('go').href = target;
  var go = function () { location.replace(target); };
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
      .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null; })
      .then(go, go);
  } else go();
</script>
</body>
</html>
